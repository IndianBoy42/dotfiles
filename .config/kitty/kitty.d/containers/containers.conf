# Container entry points for kitty.
#
# Loaded automatically: kitty includes every *.conf inside any subdirectory of
# ~/.config/kitty/kitty.d/, so container bindings stay out of kitty.conf.

# Enter the arch dev container in its own OS window.
#
# `kitten run-shell` is the upstream mechanism for shells in containers, and it is what
# gives the container's shell the same behaviour as a kitty shell on the host: prompt
# marks (jump to previous prompt, click to move the cursor), cwd/window-title tracking,
# glitch-free resize redraw, and clone-in-kitty. Plain `distrobox enter` starts a normal
# login shell, so none of that exists in the container.
#
# It also handles the terminal identity: the kitten sets TERM=xterm-kitty and exports the
# terminfo that ships with kitty, which is what keeps TUIs inside the container correct.
# kitty.conf maps kitty_mod+o>n / >j / >p for host apps, so containers live alongside them.
map kitty_mod+o>a launch --copy-env --type=os-window --cwd=current distrobox enter arch -- kitten run-shell
map kitty_mod+o>kitty_mod+a launch --copy-env --type=os-window --cwd=current distrobox enter arch -- kitten run-shell
