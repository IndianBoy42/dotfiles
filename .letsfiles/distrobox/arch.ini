# Declarative definition of the `arch` dev container.
#
#   lets distrobox create   create it if it does not exist
#   lets distrobox pkgs     sync the package set below into a live container
#   lets distrobox rebuild  destroy and recreate it from this file
#   lets distrobox paru     (re)install the AUR helper, which pacman cannot do
#   lets distrobox check    prove each workload works inside it
#
# Why this is shaped the way it is: README.md next to this file.

[arch]
image=ghcr.io/ublue-os/arch-toolbox:latest
pull=false
start_now=false

# The image already puts /home/linuxbrew/.linuxbrew/bin on its PATH but mounts nothing,
# so those entries are dead until this volume exists. Read-only on purpose: brew builds
# from source against whatever libc it finds, so a writable brew would let the container
# write Arch-linked binaries into the host's Cellar.
volume="/home/linuxbrew:/home/linuxbrew:ro"

# go/JS: the runtime for node/pnpm/bun comes from brew above; go is not in brew at all.
# cmake is installed in brew but is not linked into its bin/, so the container needs its own.
# uv is here rather than taken from brew so the python workflow does not depend on the mount.
additional_packages="go cmake jq uv pkgconf base-devel gdb"

# rust: cargo, rustc, rustup, probe-rs and wild all come from the shared ~/.cargo.
# These are the system libraries cargo needs to *link* a GUI (gtk-rs, libadwaita, tauri).
additional_packages="gtk4 libadwaita webkit2gtk-4.1 libxkbcommon wayland mesa vulkan-icd-loader vulkan-tools alsa-lib openssl"

# embedded: arm-none-eabi-gcc, riscv64-elf-gcc, openocd, tio and esptool come from brew
# above, so they match the host's versions exactly. These are the extras Arch packages
# better than brew does, plus the ST-Link toolset brew lacks.
additional_packages="dfu-util stlink picocom minicom"

# python datascience, installed against the container's own python (brew's is read-only,
# and /usr/bin comes first on PATH anyway). uv drives per-project environments on top.
additional_packages="python-numpy python-pandas python-scipy python-matplotlib python-scikit-learn python-polars jupyterlab"

# quality of life inside the container
additional_packages="man-db man-pages bash-completion"
